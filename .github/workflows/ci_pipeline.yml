name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Install project and test tools
      run: |
        python -m pip install --upgrade pip
        pip install -e . pytest

    - name: Run tests
      # tests/test_faf5.py validates the full local FAF5 dataset (~100M rows),
      # which is not stored in the repository, so only the config tests run in CI.
      run: python -m pytest tests/test_config.py -q
