name: Audit Brazilian gas source revisions

on:
  workflow_dispatch:
  schedule:
    # Monday 09:17 UTC (06:17 America/Sao_Paulo); independent of the owner's PC.
    - cron: '17 9 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-brazil-gas.yml'
      - 'scripts/audit_brazil_gas.py'
      - 'scripts/prepare_brazil_gas.py'
      - 'scripts/prepare_brazil_gas_history.py'
      - 'freight_intelligence/brazil_gas_history.py'
      - 'freight_intelligence/brazil_gas_results.py'
      - 'freight_intelligence/ingestion/brazil_gas.py'
      - 'deployment/brazil_gas/provenance.json'
      - 'deployment/brazil_gas_history/provenance.json'

permissions:
  contents: read

concurrency:
  group: brazil-gas-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # One year at a time: parallel bursts of twelve downloads make gov.br reset connections.
      max-parallel: 1
      matrix:
        year: [2021, 2022, 2023, 2024, 2025]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install bounded data-reader runtime
        run: python -m pip install polars==2.1.0
      - name: Fetch, validate and compare twelve reviewed ANP reports for the selected year
        run: python -m scripts.audit_brazil_gas --year ${{ matrix.year }} --output source-audit --cache-dir source-cache
      - name: Keep revision report and candidate for review
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: brazil-gas-source-audit-${{ matrix.year }}-${{ github.run_id }}
          path: |
            source-audit/report.json
            source-audit/review-candidate.zip
          if-no-files-found: warn
          retention-days: 14
