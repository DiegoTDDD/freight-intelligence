name: loginexus-local

services:
  api:
    build: .
    image: loginexus-api:local
    environment:
      LOGINEXUS_REQUIRE_AUTH: "${LOGINEXUS_REQUIRE_AUTH:-false}"
      LOGINEXUS_API_KEY: "${LOGINEXUS_API_KEY:-}"
    ports:
      - "127.0.0.1:${LOGINEXUS_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ./artifacts
        target: /app/artifacts
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data/gold/faf5
        target: /app/data/gold/faf5
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./models
        target: /app/models
        read_only: true
        bind:
          create_host_path: false
