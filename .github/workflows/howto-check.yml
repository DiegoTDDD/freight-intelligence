name: How-to-run check

# Runs the steps of the README section "Running it" for real, with the real FAF5.5.1 file, and then the
# whole test suite (which checks the exact row counts of every layer). Heavy (about 100 million rows), so it
# runs only on demand ("Run workflow") so a source push cannot start a heavy rebuild.
on:
  workflow_dispatch:

jobs:
  readme-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: "README: environment and python -m pip install -e \".[app,dev]\""
        run: |
          python -m venv .venv
          echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
          .venv/bin/pip install -e ".[app,dev]"

      - name: "README: put FAF5.5.1_HiLoForecasts.csv and FAF5_metadata.xlsx in data/raw/faf5/forecast/"
        run: |
          python - <<'PY'
          import os, re, shutil, sys, urllib.request, zipfile
          from urllib.parse import urljoin
          UA = {"User-Agent": "Mozilla/5.0"}
          pages = ["https://faf.ornl.gov/faf5/", "https://faf.ornl.gov/faf5/Default.aspx", "https://www.bts.gov/faf",
                   "https://www.bts.gov/faf/faf5", "https://www.bts.gov/archive/subject_areas/freight_transportation/faf"]
          found = []
          for p in pages:
              try:
                  html = urllib.request.urlopen(urllib.request.Request(p, headers=UA), timeout=60).read().decode("utf-8", "ignore")
              except Exception as e:
                  print(f"::notice::page {p}: {e}")
                  continue
              links = [urljoin(p, h) for h in re.findall(r'href=["\']([^"\']+)', html) if re.search(r"FAF5[^\"']*\.zip", h, re.I)]
              print(f"::notice::page {p}: {len(html)} bytes, zip links: {len(links)}")
              found += links
          found = list(dict.fromkeys(found))
          for l in found:
              print("link found:", l)
          candidates = [l for l in found if "5.5.1" in l and "hilo" in l.lower()]
          candidates += ["https://faf.ornl.gov/faf5/data/download_files/FAF5.5.1_HiLoForecasts.zip"]
          os.makedirs("data/raw/faf5/forecast", exist_ok=True)
          for url in dict.fromkeys(candidates):
              try:
                  print("trying", url)
                  req = urllib.request.Request(url, headers=UA)
                  with urllib.request.urlopen(req, timeout=300) as r, open("faf.zip", "wb") as out:
                      shutil.copyfileobj(r, out)
                  with zipfile.ZipFile("faf.zip") as z:
                      print("zip content:", z.namelist())
                      print("::notice::zip content: " + " | ".join(z.namelist()[:12]))
                      for n in z.namelist():
                          if n.endswith("/"):
                              continue
                          with z.open(n) as src, open(os.path.join("data/raw/faf5/forecast", os.path.basename(n)), "wb") as dst:
                              shutil.copyfileobj(src, dst)
                  assert os.path.exists("data/raw/faf5/forecast/FAF5.5.1_HiLoForecasts.csv"), "csv missing in the zip"
                  print("downloaded from", url)
                  print("::notice::downloaded FAF5.5.1 from " + url)
                  break
              except Exception as e:
                  print(f"::notice::{url}: {e}")
          else:
              print("::error::could not download FAF5.5.1_HiLoForecasts from any link; links found on the pages: " + " | ".join(found[:12]))
              sys.exit(1)
          meta = "data/raw/faf5/forecast/FAF5_metadata.xlsx"
          if not os.path.exists(meta):
              xlsx = []
              for p in pages[:2]:
                  try:
                      html = urllib.request.urlopen(urllib.request.Request(p, headers=UA), timeout=60).read().decode("utf-8", "ignore")
                  except Exception:
                      continue
                  xlsx += [urljoin(p, h) for h in re.findall(r'href=["\']([^"\']+)', html) if re.search(r"metadata|\.xlsx", h, re.I)]
              xlsx = list(dict.fromkeys(xlsx))
              print("::notice::metadata-like links: " + " | ".join(xlsx[:10]))
              for url in xlsx:
                  if url.lower().endswith(".xlsx"):
                      try:
                          urllib.request.urlretrieve(url, meta)
                          print("::notice::metadata downloaded from " + url)
                          break
                      except Exception as e:
                          print(f"::notice::{url}: {e}")
          if not os.path.exists(meta):
              print("::error::FAF5_metadata.xlsx was not in the zip and no .xlsx link was found")
              sys.exit(1)
          PY
          ls -la data/raw/faf5/forecast
          head -c 400 data/raw/faf5/forecast/FAF5.5.1_HiLoForecasts.csv; echo
          echo "::notice::csv header: $(head -1 data/raw/faf5/forecast/FAF5.5.1_HiLoForecasts.csv | cut -c1-300) | lines: $(wc -l < data/raw/faf5/forecast/FAF5.5.1_HiLoForecasts.csv)"

      - name: "README: python -m freight_intelligence.pipeline (the complete pipeline)"
        run: |
          if ! python -u -m freight_intelligence.pipeline 2>&1 | tee pipeline.log; then
            echo "::error::Pipeline failed; see pipeline.log for the complete output"
            exit 1
          fi
          ls -la data/gold/faf5
          du -sh data/*

      - name: "README: python -m pytest (row counts and quality of every layer)"
        run: |
          if ! python -m pytest -q --tb=short 2>&1 | tee pytest.log; then
            echo "::error::pytest failed; see pytest.log for the complete output"
            exit 1
          fi

      - name: "README: streamlit run dashboards/app.py starts"
        run: |
          nohup python -m streamlit run dashboards/app.py --server.headless true --server.port 8501 > dashboard.log 2>&1 &
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:8501/_stcore/health >/dev/null; then echo "dashboard is up"; exit 0; fi
            sleep 2
          done
          tail -30 dashboard.log
          exit 1

      - name: Preserve diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: howto-check-logs
          path: |
            pipeline.log
            pytest.log
            dashboard.log
          if-no-files-found: ignore
          retention-days: 7
