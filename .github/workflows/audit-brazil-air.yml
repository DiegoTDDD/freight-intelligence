name: Audit Brazilian air source revisions

on:
  workflow_dispatch:
  schedule:
    # Monday 09:37 UTC (06:37 America/Sao_Paulo), independent of the owner's PC.
    - cron: '37 9 * * 1'
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-brazil-air.yml'
      - 'scripts/audit_brazil_air.py'
      - 'scripts/prepare_brazil_air.py'
      - 'freight_intelligence/brazil_air.py'
      - 'deployment/brazil_air/provenance.json'

permissions:
  contents: read

concurrency:
  group: brazil-air-source-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install source-reader runtime
        run: python -m pip install polars==2.1.0
      - name: Stream, check headers and compare the reviewed ANAC source
        run: python -m scripts.audit_brazil_air --output air-source-audit
      - name: Keep report and changed source for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: brazil-air-source-audit-${{ github.run_id }}
          path: |
            air-source-audit/report.json
            air-source-audit/unreviewed-source.csv
          if-no-files-found: warn
          retention-days: 14
